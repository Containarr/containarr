<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>Access denied</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f8fa; color: #172033; }
      main { width: min(100%, 460px); padding: 40px; border: 1px solid #d9e0e8; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px rgba(23, 32, 51, .08); text-align: center; }
      svg { width: 52px; height: 52px; color: #2f86b7; }
      h1 { margin: 22px 0 10px; font-size: 28px; letter-spacing: -.03em; }
      p { margin: 0; color: #667085; font-size: 15px; line-height: 1.6; }
      footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid #e7ebf0; color: #8a94a6; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        body { background: #101214; color: #f3f4f6; }
        main { background: #17191b; border-color: #303438; box-shadow: 0 18px 50px rgba(0, 0, 0, .25); }
        p { color: #a7abb2; }
        footer { border-color: #303438; color: #858a92; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <h1>Access denied</h1>
      <p>This app is protected by a Containarr Firewall Policy. Your current network is not allowed to access it.</p>
      <footer>Containarr</footer>
    </main>
  </body>
</html>
